services:
  minicms-server:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8787"
      MINICMS_PROJECT_ROOT: /data
      MINICMS_SESSION_SECRET: "${MINICMS_SESSION_SECRET:?Set MINICMS_SESSION_SECRET}"
      MINICMS_READ_TOKEN: "${MINICMS_READ_TOKEN:-}"
      MINICMS_IMAGE_CACHE_DIR: /data/.cache
      MINICMS_ADMIN_SCRIPT_URL: "${MINICMS_ADMIN_SCRIPT_URL:-https://rawcdn.githack.com/signalwerk/miniCMS/d349006d9ef97062076c7beacdca5a98badd5278/minicms.js}"
    volumes:
      - "/DATA/miniCMS/backend/data:/data"
    tmpfs:
      - "/tmp:size=256m,mode=1777"
    expose:
      - "8787"
